<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok Takip</title>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
  --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --border: #334155;
  --warning: #f59e0b;
}
[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --muted: #64748b;
  --primary: #2563eb; --danger: #dc2626; --success: #16a34a; --border: #e2e8f0;
  --warning: #d97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding: 1rem;
}
header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap;
}
h1 { font-size: 1.3rem; font-weight: 600; }
nav { display: flex; gap: .4rem; flex-wrap: wrap; }
nav button, .btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: .4rem .75rem; border-radius: 6px;
  cursor: pointer; font-size: .85rem;
}
nav button.active, .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-sm { padding: .2rem .45rem; font-size: .8rem; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 1rem; margin-bottom: 1rem;
}
.alert { border-left: 4px solid var(--danger); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; }
th, td { padding: .45rem .6rem; border-bottom: 1px solid var(--border); text-align: left; font-size: .87rem; }
th { color: var(--muted); font-weight: 500; font-size: .75rem; }
input, select {
  padding: .4rem .6rem; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: .87rem;
}
.form-row { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .5rem; align-items: center; }
#toast {
  position: fixed; bottom: 1.2rem; right: 1.2rem; padding: .7rem 1.1rem;
  border-radius: 8px; background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,.3); display: none; z-index: 100;
}
#toast.show { display: block; }
#toast.success { border-left: 4px solid var(--success); }
#toast.error { border-left: 4px solid var(--danger); }
.hidden { display: none !important; }
.stat { font-size: 1.4rem; font-weight: 600; }
.stat-label { font-size: .78rem; color: var(--muted); }
.stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }
kbd {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  padding: .1rem .35rem; font-size: .75rem;
}
</style>
</head>
<body>
<header>
  <h1>Stok Takip</h1>
  <nav>
    <button class="active" data-view="dashboard">Dashboard</button>
    <button data-view="products">Ürünler</button>
    <button data-view="stock">Stok İşlem</button>
    <button data-view="history">Hareketler</button>
    <button data-view="reports">Raporlar</button>
    <button id="theme-btn" title="Tema">🌓</button>
  </nav>
</header>

<div id="toast"></div>

<!-- DASHBOARD -->
<section id="view-dashboard" class="view">
  <div class="card stats" id="stats-box">
    <div><div class="stat" id="stat-products">0</div><div class="stat-label">Ürün</div></div>
    <div><div class="stat" id="stat-low">0</div><div class="stat-label">Kritik Stok</div></div>
    <div><div class="stat" id="stat-cost">0</div><div class="stat-label">Toplam Maliyet</div></div>
    <div><div class="stat" id="stat-sell">0</div><div class="stat-label">Potansiyel Satış</div></div>
  </div>
  <div class="card alert" id="low-stock-box">Kritik stok yok</div>
  <div class="card">
    <div class="form-row">
      <input id="barcode-search" placeholder="Barkod okut / ara... (Enter)" style="min-width:220px" autofocus>
      <button class="btn-primary" onclick="searchBarcode()">Ara</button>
      <span class="stat-label">Kısayollar: <kbd>F2</kbd> Yeni Ürün · <kbd>F4</kbd> Barkod · <kbd>F5</kbd> Yenile</span>
    </div>
    <div id="barcode-result" class="muted" style="margin-top:.5rem"></div>
  </div>
</section>

<!-- PRODUCTS -->
<section id="view-products" class="view hidden">
  <div class="card">
    <h3 style="margin-bottom:.6rem">Yeni / Düzenle Ürün</h3>
    <div class="form-row">
      <input id="p-name" placeholder="Ürün adı *">
      <input id="p-barcode" placeholder="Barkod">
      <input id="p-sku" placeholder="SKU">
      <input id="p-unit" placeholder="Birim" value="adet" style="width:70px">
      <input id="p-buy" type="number" step="0.01" placeholder="Alış" style="width:85px">
      <input id="p-sell" type="number" step="0.01" placeholder="Satış" style="width:85px">
      <input id="p-min" type="number" placeholder="Min" value="0" style="width:70px">
      <button class="btn-primary" onclick="saveProduct()">Kaydet</button>
      <button onclick="resetProductForm()">Temizle</button>
    </div>
    <input type="hidden" id="p-id">
  </div>
  <div class="card">
    <div class="form-row">
      <input id="product-search" placeholder="Ara (ad, barkod, sku)..." oninput="loadProducts()">
    </div>
    <table>
      <thead><tr><th>Barkod</th><th>Ad</th><th>Stok</th><th>Alış</th><th>Satış</th><th>İşlem</th></tr></thead>
      <tbody id="product-tbody"></tbody>
    </table>
  </div>
</section>

<!-- STOCK -->
<section id="view-stock" class="view hidden">
  <div class="grid-2">
    <div class="card">
      <h3 style="margin-bottom:.6rem">Stok Giriş</h3>
      <div class="form-row">
        <input id="in-barcode" placeholder="Barkod">
        <input id="in-qty" type="number" placeholder="Miktar" value="1" style="width:80px">
        <input id="in-price" type="number" step="0.01" placeholder="Alış fiyatı" style="width:100px">
        <input id="in-ref" placeholder="Fiş/Fatura no">
        <button class="btn-primary" onclick="doStockIn()">Giriş Yap</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:.6rem">Stok Çıkış</h3>
      <div class="form-row">
        <input id="out-barcode" placeholder="Barkod">
        <input id="out-qty" type="number" placeholder="Miktar" value="1" style="width:80px">
        <input id="out-ref" placeholder="Fiş no">
        <button class="btn-primary" onclick="doStockOut()">Çıkış Yap</button>
      </div>
    </div>
  </div>
  <div class="card">
    <h3 style="margin-bottom:.6rem">Sayım / Düzeltme</h3>
    <div class="form-row">
      <input id="adj-barcode" placeholder="Barkod">
      <input id="adj-qty" type="number" placeholder="Yeni miktar" style="width:100px">
      <input id="adj-notes" placeholder="Not (fire, kayıp...)">
      <button class="btn-primary" onclick="doAdjust()">Düzelt</button>
    </div>
  </div>
</section>

<!-- HISTORY -->
<section id="view-history" class="view hidden">
  <div class="card">
    <h3 style="margin-bottom:.6rem">Son Hareketler</h3>
    <table>
      <thead><tr><th>Tarih</th><th>Ürün</th><th>Tip</th><th>Miktar</th><th>Fiyat</th><th>Not</th></tr></thead>
      <tbody id="history-tbody"></tbody>
    </table>
  </div>
</section>

<!-- REPORTS -->
<section id="view-reports" class="view hidden">
  <div class="card stats" id="report-stats"></div>
  <div class="card">
    <button class="btn-primary" onclick="exportCsv()">CSV Olarak İndir (Ürünler)</button>
  </div>
</section>

<script type="module">
const { invoke } = window.__TAURI__.core;

let currentView = 'dashboard';

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => el.className = '', 2800);
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById('view-' + name).classList.remove('hidden');
  document.querySelectorAll('nav button[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === name);
  });
  currentView = name;
  if (name === 'dashboard') refreshDashboard();
  if (name === 'products') loadProducts();
  if (name === 'history') loadHistory();
  if (name === 'reports') loadReport();
}

document.querySelectorAll('nav button[data-view]').forEach(btn => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});

// Theme
const themeBtn = document.getElementById('theme-btn');
themeBtn.onclick = () => {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next === 'dark' ? '' : 'light');
  localStorage.setItem('theme', next);
};
if (localStorage.getItem('theme') === 'light') {
  document.documentElement.setAttribute('data-theme', 'light');
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    if (e.key === 'Enter' && e.target.id === 'barcode-search') {
      e.preventDefault();
      searchBarcode();
    }
    return;
  }
  if (e.key === 'F2') { e.preventDefault(); showView('products'); document.getElementById('p-name').focus(); }
  if (e.key === 'F4') { e.preventDefault(); showView('dashboard'); document.getElementById('barcode-search').focus(); }
  if (e.key === 'F5') { e.preventDefault(); refreshDashboard(); loadProducts(); }
});

async function refreshDashboard() {
  try {
    const report = await invoke('stock_value_report');
    document.getElementById('stat-products').textContent = report.product_count;
    document.getElementById('stat-low').textContent = report.low_stock_count;
    document.getElementById('stat-cost').textContent = report.total_cost.toFixed(2);
    document.getElementById('stat-sell').textContent = report.total_sell_value.toFixed(2);

    const low = await invoke('low_stock_products');
    const box = document.getElementById('low-stock-box');
    if (!low.length) {
      box.className = 'card';
      box.textContent = 'Kritik stok yok';
    } else {
      box.className = 'card alert';
      box.innerHTML = low.map(p =>
        `<div style="margin-bottom:.3rem"><strong>${p.name}</strong> — ${p.current_stock} ${p.unit} (min: ${p.min_stock_level})</div>`
      ).join('');
    }
  } catch (e) {
    toast(String(e), 'error');
  }
}

async function loadProducts() {
  try {
    const q = document.getElementById('product-search')?.value || null;
    const products = await invoke('list_products', { search: q });
    const tbody = document.getElementById('product-tbody');
    if (!products.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">Ürün yok</td></tr>';
      return;
    }
    tbody.innerHTML = products.map(p => `
      <tr>
        <td>${p.barcode || '-'}</td>
        <td>${p.name}</td>
        <td>${p.current_stock} ${p.unit}</td>
        <td>${p.buy_price}</td>
        <td>${p.sell_price}</td>
        <td>
          <button class="btn-sm" onclick='editProduct(${JSON.stringify(p)})'>Düzenle</button>
          <button class="btn-sm btn-danger" onclick="deleteProduct(${p.id})">Sil</button>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    toast(String(e), 'error');
  }
}

window.editProduct = function(p) {
  document.getElementById('p-id').value = p.id;
  document.getElementById('p-name').value = p.name;
  document.getElementById('p-barcode').value = p.barcode || '';
  document.getElementById('p-sku').value = p.sku || '';
  document.getElementById('p-unit').value = p.unit;
  document.getElementById('p-buy').value = p.buy_price;
  document.getElementById('p-sell').value = p.sell_price;
  document.getElementById('p-min').value = p.min_stock_level;
  document.getElementById('p-name').focus();
};

window.resetProductForm = function() {
  document.getElementById('p-id').value = '';
  document.getElementById('p-name').value = '';
  document.getElementById('p-barcode').value = '';
  document.getElementById('p-sku').value = '';
  document.getElementById('p-unit').value = 'adet';
  document.getElementById('p-buy').value = '';
  document.getElementById('p-sell').value = '';
  document.getElementById('p-min').value = '0';
};

window.saveProduct = async function() {
  const name = document.getElementById('p-name').value.trim();
  if (!name) return toast('Ürün adı zorunlu', 'error');
  const id = document.getElementById('p-id').value;
  try {
    if (id) {
      await invoke('update_product', {
        p: {
          id: +id,
          name,
          barcode: document.getElementById('p-barcode').value.trim() || null,
          sku: document.getElementById('p-sku').value.trim() || null,
          unit: document.getElementById('p-unit').value.trim() || 'adet',
          buy_price: +document.getElementById('p-buy').value || 0,
          sell_price: +document.getElementById('p-sell').value || 0,
          min_stock_level: +document.getElementById('p-min').value || 0
        }
      });
      toast('Ürün güncellendi');
    } else {
      await invoke('create_product', {
        p: {
          name,
          barcode: document.getElementById('p-barcode').value.trim() || null,
          sku: document.getElementById('p-sku').value.trim() || null,
          unit: document.getElementById('p-unit').value.trim() || 'adet',
          buy_price: +document.getElementById('p-buy').value || 0,
          sell_price: +document.getElementById('p-sell').value || 0,
          min_stock_level: +document.getElementById('p-min').value || 0
        }
      });
      toast('Ürün eklendi');
    }
    resetProductForm();
    loadProducts();
  } catch (e) {
    toast(String(e), 'error');
  }
};

window.deleteProduct = async function(id) {
  if (!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
  try {
    await invoke('delete_product', { id });
    toast('Ürün silindi');
    loadProducts();
  } catch (e) {
    toast(String(e), 'error');
  }
};

async function findByBarcode(barcode) {
  return await invoke('get_product_by_barcode', { barcode });
}

window.searchBarcode = async function() {
  const barcode = document.getElementById('barcode-search').value.trim();
  if (!barcode) return;
  try {
    const p = await findByBarcode(barcode);
    document.getElementById('barcode-result').innerHTML =
      `<strong>${p.name}</strong> — Stok: ${p.current_stock} ${p.unit} | Alış: ${p.buy_price} | Satış: ${p.sell_price}`;
    document.getElementById('barcode-search').select();
  } catch {
    document.getElementById('barcode-result').textContent = 'Ürün bulunamadı: ' + barcode;
  }
};

window.doStockIn = async function() {
  const barcode = document.getElementById('in-barcode').value.trim();
  const qty = +document.getElementById('in-qty').value;
  if (!barcode || !qty || qty <= 0) return toast('Barkod ve miktar gerekli', 'error');
  try {
    const p = await findByBarcode(barcode);
    await invoke('stock_in', {
      productId: p.id,
      quantity: qty,
      unitPrice: +document.getElementById('in-price').value || null,
      referenceNo: document.getElementById('in-ref').value.trim() || null,
      notes: null
    });
    toast(`Giriş: ${p.name} +${qty}`);
    document.getElementById('in-barcode').value = '';
    document.getElementById('in-barcode').focus();
  } catch (e) {
    toast(String(e), 'error');
  }
};

window.doStockOut = async function() {
  const barcode = document.getElementById('out-barcode').value.trim();
  const qty = +document.getElementById('out-qty').value;
  if (!barcode || !qty || qty <= 0) return toast('Barkod ve miktar gerekli', 'error');
  try {
    const p = await findByBarcode(barcode);
    await invoke('stock_out', {
      productId: p.id,
      quantity: qty,
      referenceNo: document.getElementById('out-ref').value.trim() || null,
      notes: null
    });
    toast(`Çıkış: ${p.name} -${qty}`);
    document.getElementById('out-barcode').value = '';
    document.getElementById('out-barcode').focus();
  } catch (e) {
    toast(String(e), 'error');
  }
};

window.doAdjust = async function() {
  const barcode = document.getElementById('adj-barcode').value.trim();
  const qty = +document.getElementById('adj-qty').value;
  if (!barcode || isNaN(qty)) return toast('Barkod ve yeni miktar gerekli', 'error');
  try {
    const p = await findByBarcode(barcode);
    await invoke('adjust_stock', {
      productId: p.id,
      newQuantity: qty,
      notes: document.getElementById('adj-notes').value.trim() || null
    });
    toast(`Düzeltme: ${p.name} → ${qty}`);
    document.getElementById('adj-barcode').value = '';
  } catch (e) {
    toast(String(e), 'error');
  }
};

async function loadHistory() {
  try {
    const list = await invoke('list_transactions', { limit: 100 });
    const tbody = document.getElementById('history-tbody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">Hareket yok</td></tr>';
      return;
    }
    const typeMap = { in: 'Giriş', out: 'Çıkış', adjustment: 'Düzeltme' };
    tbody.innerHTML = list.map(t => `
      <tr>
        <td>${t.created_at}</td>
        <td>${t.product_name}</td>
        <td>${typeMap[t.transaction_type] || t.transaction_type}</td>
        <td>${t.quantity}</td>
        <td>${t.unit_price ?? '-'}</td>
        <td>${t.notes || t.reference_no || '-'}</td>
      </tr>
    `).join('');
  } catch (e) {
    toast(String(e), 'error');
  }
}

async function loadReport() {
  try {
    const r = await invoke('stock_value_report');
    document.getElementById('report-stats').innerHTML = `
      <div><div class="stat">${r.product_count}</div><div class="stat-label">Toplam Ürün</div></div>
      <div><div class="stat">${r.low_stock_count}</div><div class="stat-label">Kritik Stok</div></div>
      <div><div class="stat">${r.total_cost.toFixed(2)}</div><div class="stat-label">Toplam Maliyet</div></div>
      <div><div class="stat">${r.total_sell_value.toFixed(2)}</div><div class="stat-label">Potansiyel Satış Değeri</div></div>
    `;
  } catch (e) {
    toast(String(e), 'error');
  }
}

window.exportCsv = async function() {
  try {
    const products = await invoke('list_products', { search: null });
    const header = 'id,barcode,sku,name,unit,buy_price,sell_price,min_stock_level,current_stock\n';
    const rows = products.map(p =>
      [p.id, p.barcode||'', p.sku||'', `"${p.name}"`, p.unit, p.buy_price, p.sell_price, p.min_stock_level, p.current_stock].join(',')
    ).join('\n');
    const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'stok-urunler.csv';
    a.click();
    URL.revokeObjectURL(url);
    toast('CSV indirildi');
  } catch (e) {
    toast(String(e), 'error');
  }
};

// Init
refreshDashboard();
</script>
</body>
</html>
